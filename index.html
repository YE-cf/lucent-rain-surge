<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucent · Rain · Surge</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #236D74;
    color: #22322A;
    line-height: 1.9;
    min-height: 100vh;
  }
  h1, h2, h3, h4 { font-family: "仿宋", FangSong, "宋体", SimSun, "STSong", serif; }

  /* 全局 SVG 大小约束 */
  svg { width: 1em; height: 1em; vertical-align: -0.15em; }
  button svg { width: 14px; height: 14px; vertical-align: -2px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(213,250,241,.25);
    padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 {
    font-size: 16px; margin: 0; font-weight: normal;
    letter-spacing: 2px;
    color: #C5FCE0;
  }
  .user { font-size: 14px; color: #C5FCE0; display: flex; gap: 10px; align-items: center; }
  .user span { opacity: .9; }

  button {
    font-family: inherit; cursor: pointer;
    border: 1px solid rgba(213,250,241,.35);
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #C5FCE0;
    padding: 6px 14px; border-radius: 10px; font-size: 13px;
    transition: .2s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: rgba(255,255,255,.2); border-color: rgba(213,250,241,.6); }
  button.primary { background: rgba(255,255,255,.18); border-color: rgba(213,250,241,.5); color: #C5FCE0; }
  button.primary:hover { background: rgba(255,255,255,.28); }
  button.danger { color: #FFCDD2; border-color: rgba(255,205,210,.4); }
  button.danger:hover { background: rgba(211,47,47,.3); border-color: rgba(211,47,47,.6); }
  button.mini { padding: 3px 10px; font-size: 12px; }

  main { max-width: 1000px; margin: 0 auto; padding: 40px 24px 100px; }

  .hero { text-align: center; padding: 60px 0 40px; }
  .hero h2 {
    font-size: 32px; font-weight: normal;
    margin: 0 0 20px;
    letter-spacing: 4px;
    color: #C5FCE0;
  }
  .hero p {
    color: #22322A; opacity: .8;
    margin: 0 auto; font-size: 14px;
    line-height: 2.2;
    max-width: 500px;
  }

  .spaces {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px; margin-top: 40px;
  }
  .space-card {
    background: rgba(255,255,255,.16);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.4);
    border-radius: 18px;
    padding: 28px 18px; text-align: center; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    transition: .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .space-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,.14);
    background: rgba(255,255,255,.22);
  }
  .space-card .icon { font-size: 36px; margin-bottom: 12px; }
  .space-card .name { font-weight: 600; font-size: 15px; letter-spacing: 1px; }
  .space-card .role { font-size: 12px; opacity: .6; margin-top: 6px; letter-spacing: 1px; }

  .space-header {
    background: rgba(255,255,255,.16);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.35);
    border-radius: 18px;
    padding: 24px 28px; margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }
  .space-header .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .space-header h2 { margin: 0 0 8px; font-size: 22px; font-weight: normal; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
  .mode-badge {
    display: inline-block; font-size: 12px; padding: 3px 12px; border-radius: 20px;
    background: rgba(255,255,255,.25); color: #22322A; letter-spacing: 1px;
    border: 1px solid rgba(213,250,241,.3);
  }
  .breadcrumb {
    margin-top: 12px; font-size: 13px; opacity: .7;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .breadcrumb a { color: #22322A; cursor: pointer; text-decoration: none; border-bottom: 1px dashed transparent; opacity: .9; }
  .breadcrumb a:hover { border-bottom-color: #22322A; }
  .breadcrumb .sep { opacity: .4; }

  /* 日历 */
  .calendar-module {
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.3);
    border-radius: 14px;
    padding: 12px 18px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .cal-collapsed { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 12px; }
  .cal-collapsed .cal-left {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; letter-spacing: 1px;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .cal-collapsed .cal-left svg { flex-shrink: 0; }
  .cal-collapsed .cal-toggle { font-size: 12px; opacity: .6; flex-shrink: 0; }
  .calendar-module.expanded .cal-collapsed { margin-bottom: 12px; }
  .cal-body { display: none; }
  .calendar-module.expanded .cal-body { display: block; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
  .cal-title { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .cal-nav { display: flex; gap: 6px; align-items: center; }
  .cal-nav button { padding: 3px 10px; font-size: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 11px; opacity: .6; padding: 4px 0; font-weight: 600; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 8px; font-size: 12px; cursor: pointer; transition: .15s;
    position: relative; background: rgba(255,255,255,.08);
    -webkit-tap-highlight-color: transparent;
  }
  .cal-day.other-month { opacity: .15; background: transparent; cursor: default; }
  .cal-day:not(.other-month):hover { background: rgba(255,255,255,.2); }
  .cal-day.today { background: rgba(197,252,224,.35); font-weight: 700; }
  .cal-day .dot { position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: #C5FCE0; }

  .filters {
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.3);
    border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
    display: flex; flex-direction: column; gap: 10px;
  }
  .filters input[type="text"] {
    width: 100%; padding: 10px 14px;
    border: 1px solid rgba(213,250,241,.35);
    background: rgba(255,255,255,.1);
    border-radius: 10px;
    font-family: inherit; font-size: 14px; color: #22322A;
  }
  .filters input[type="text"]::placeholder { color: #22322A; opacity: .5; }
  .filters input[type="text"]:focus { outline: none; border-color: rgba(197,252,224,.7); background: rgba(255,255,255,.18); }
  .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; opacity: .8; }
  .filter-row select, .filter-row input[type="date"] {
    padding: 6px 10px; border: 1px solid rgba(213,250,241,.35);
    background: rgba(255,255,255,.1); color: #22322A;
    border-radius: 8px; font-family: inherit; font-size: 13px;
  }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.3);
    padding: 5px; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
    flex-wrap: wrap;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px;
    cursor: pointer; font-size: 14px; opacity: .75;
    transition: .2s; user-select: none;
    min-width: 90px; letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:hover { background: rgba(255,255,255,.12); opacity: 1; }
  .tab.active { background: rgba(255,255,255,.28); opacity: 1; font-weight: 600; }
  .tab .badge-count {
    display: inline-block; background: rgba(197,252,224,.8); color: #22322A;
    font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px;
  }

  .subtabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    padding: 4px; border-radius: 10px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(213,250,241,.25);
    align-items: center;
  }
  .subtab {
    flex: 1; text-align: center; padding: 8px; border-radius: 8px;
    cursor: pointer; font-size: 13px; opacity: .7;
    transition: .2s; user-select: none;
  }
  .subtab:hover { background: rgba(255,255,255,.1); opacity: 1; }
  .subtab.active { background: rgba(255,255,255,.22); opacity: 1; font-weight: 600; }
  .subtab-actions { padding: 0 8px; display: flex; align-items: center; }
  .bingo-btn {
    background: rgba(255,233,128,.6); color: #3F3B2B;
    border: 1px solid rgba(255,233,128,.8);
    padding: 6px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    letter-spacing: 1px; transition: .2s;
  }
  .bingo-btn:hover { background: rgba(255,233,128,.85); }
  .bingo-btn:disabled { background: rgba(255,255,255,.1); color: #22322A; opacity: .4; cursor: not-allowed; border-color: rgba(213,250,241,.2); }

  .desktop { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

  .folder, .file-card {
    background: rgba(255,255,255,.16);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.4);
    border-radius: 16px;
    padding: 18px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    transition: .25s; position: relative;
    -webkit-tap-highlight-color: transparent;
    color: #22322A;
  }
  .folder:hover, .file-card:hover {
    box-shadow: 0 10px 30px rgba(0,0,0,.14);
    transform: translateY(-3px);
    background: rgba(255,255,255,.24);
  }
  .folder.warm, .file-card.warm { background: rgba(255,233,128,.28); border-color: #FDFBDA; color: #3F3B2B; }
  .folder.warm:hover, .file-card.warm:hover { background: rgba(255,233,128,.42); }
  .folder.cool, .file-card.cool { background: rgba(136,226,209,.24); border-color: #D5FAF1; color: #293D52; }
  .folder.cool:hover, .file-card.cool:hover { background: rgba(136,226,209,.38); }

  .folder .fname {
    font-weight: 600; font-size: 14px; margin-bottom: 8px; padding-right: 30px;
    word-break: break-all; letter-spacing: .5px;
    display: flex; align-items: center; gap: 6px;
  }
  .folder .fname svg { width: 18px; height: 18px; flex-shrink: 0; }
  .folder .fmeta { font-size: 12px; opacity: .7; line-height: 1.7; }
  .folder .edit-btn {
    position: absolute; top: 14px; right: 14px;
    width: 28px; height: 28px; padding: 0;
    border-radius: 8px; font-size: 13px;
    opacity: 0; transition: .2s;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.3); border-color: transparent; color: inherit;
  }
  .folder:hover .edit-btn { opacity: 1; }
  .folder .edit-btn:hover { background: rgba(255,255,255,.5); color: inherit; }

  .file-card { display: flex; flex-direction: column; min-height: 160px; }
  .file-card img { width: 100%; border-radius: 10px; display: block; margin-bottom: 10px; height: 120px; object-fit: cover; }
  .file-card .ftitle {
    font-weight: 600; font-size: 14px; margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .5px;
  }
  .file-card .text {
    white-space: pre-wrap; font-size: 13px; opacity: .8;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; flex: 1;
  }
  .file-card .letter-snippet {
    padding: 10px; border-radius: 10px; font-size: 13px; line-height: 1.7;
    max-height: 90px; overflow: hidden; white-space: pre-wrap;
    border: 1px solid rgba(255,255,255,.3);
    font-family: "仿宋", FangSong, "宋体", SimSun, serif;
  }
  .file-card .meta { font-size: 11px; opacity: .7; margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .file-card .mine-tag {
    position: absolute; top: 12px; right: 12px;
    font-size: 10px; color: #293D52; background: rgba(197,252,224,.6);
    padding: 2px 8px; border-radius: 20px; letter-spacing: 1px;
  }
  .file-card .folder-tag {
    font-size: 11px; background: rgba(255,255,255,.25); padding: 2px 8px;
    border-radius: 20px; display: inline-block; margin-top: 6px; word-break: break-all;
  }
  .file-card .img-count-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,.4); color: #fff;
    font-size: 11px; padding: 2px 7px; border-radius: 10px;
  }

  .vis-badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 500; color: #fff; letter-spacing: .5px; display: inline-block; }
  .vis-public   { background: #7F85D3; }
  .vis-password { background: #B556C7; }
  .vis-ours     { background: #89E1AD; color: #293D52; }
  .vis-private  { background: #FEE673; color: #3F3B2B; }

  .detail-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }
  .mini-back-btn { padding: 6px 14px; font-size: 12px; border-radius: 10px; min-height: auto; display: flex; align-items: center; gap: 6px; letter-spacing: 1px; }
  .mini-back-btn svg { width: 16px; height: 16px; }
  .detail-topbar-actions { display: flex; gap: 6px; }

  .reader-split { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 20px; }
  .reader-left { flex: 0 0 60%; max-width: 60%; }
  .reader-right { flex: 1; padding: 20px 0; }
  .reader-title { font-size: 24px; font-weight: normal; margin: 0 0 10px; line-height: 1.5; letter-spacing: 2px; }
  .reader-meta { font-size: 12px; opacity: .7; margin-bottom: 24px; letter-spacing: 1px; }
  .reader-text { font-size: 15px; line-height: 2; white-space: pre-wrap; letter-spacing: .5px; }

  .book-area { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; position: relative; }
  .book-page-wrap { width: 100%; max-width: 300px; aspect-ratio: 3/4; position: relative; }
  @media (min-width: 768px) { .book-page-wrap { width: 300px; height: 400px; aspect-ratio: auto; } }
  .book-page {
    width: 100%; height: 100%; border-radius: 14px; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    display: flex; flex-direction: column; position: relative;
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.4);
  }
  .book-page-inner { flex: 1; padding: 24px 22px; overflow: hidden; position: relative; word-break: break-word; }
  .book-page-inner.image-page { padding: 16px; display: flex; flex-direction: column; justify-content: center; }
  .book-page-inner.image-page img { width: 90%; height: auto; max-height: 70%; object-fit: contain; margin: 0 auto; border-radius: 8px; }
  .book-page-inner.image-page .page-text { font-size: 13px; opacity: .8; margin-top: 12px; white-space: pre-wrap; }
  .book-page-inner.letter-page { font-family: "仿宋", FangSong, "宋体", SimSun, serif; font-size: 16px; line-height: 2.2; white-space: pre-wrap; letter-spacing: 1px; }
  .page-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; letter-spacing: 1px; }
  .image-page-title { text-align: center; margin-bottom: 8px; font-size: 14px; }
  .book-nav-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(213,250,241,.4);
    background: rgba(255,255,255,.15); backdrop-filter: blur(8px);
    color: #22322A;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; flex-shrink: 0; transition: .2s;
  }
  .book-nav-btn:hover { background: rgba(255,255,255,.3); }
  .book-nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .page-indicator { text-align: center; font-size: 13px; opacity: .7; margin-top: 10px; letter-spacing: 2px; }

  .comments-section {
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(213,250,241,.3);
    border-radius: 16px; padding: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .comments-section h3 { margin: 0 0 18px; font-size: 16px; font-weight: normal; display: flex; align-items: center; gap: 8px; letter-spacing: 2px; }
  .comments-section h3 .count { font-size: 13px; opacity: .6; font-weight: normal; }
  .comment-input-box { background: rgba(255,255,255,.1); border: 1px solid rgba(213,250,241,.25); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
  .comment-input-box textarea {
    width: 100%; min-height: 70px; resize: vertical;
    border: 1px solid rgba(213,250,241,.3);
    background: rgba(255,255,255,.15); border-radius: 10px;
    padding: 10px; font-family: inherit; font-size: 14px; color: #22322A;
  }
  .comment-input-box textarea::placeholder { color: #22322A; opacity: .5; }
  .comment-input-box textarea:focus { outline: none; border-color: rgba(197,252,224,.7); background: rgba(255,255,255,.22); }
  .comment-input-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 10px; }
  .identity-toggle { display: flex; gap: 12px; font-size: 13px; align-items: center; }
  .identity-toggle label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .identity-toggle input[type="radio"] { accent-color: #C5FCE0; }

  .comment-list { display: flex; flex-direction: column; gap: 14px; }
  .comment { background: rgba(255,255,255,.1); border-radius: 12px; padding: 14px 16px; border-left: 3px solid rgba(255,255,255,.4); }
  .comment.hidden-by-owner { border-left-color: #FFE980; background: rgba(255,233,128,.15); }
  .comment.hidden-by-self { border-left-color: rgba(255,255,255,.3); background: rgba(255,255,255,.06); opacity: .7; }
  .comment-head { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: .8; margin-bottom: 6px; flex-wrap: wrap; }
  .comment-head .who { font-weight: 600; font-size: 14px; letter-spacing: .5px; }
  .comment-head .time { opacity: .6; font-size: 12px; }
  .comment-head .badge { font-size: 10px; padding: 1px 8px; border-radius: 12px; background: rgba(255,255,255,.3); }
  .badge-hidden { background: rgba(255,233,128,.6); color: #3F3B2B; }
  .comment-text { white-space: pre-wrap; font-size: 14px; line-height: 1.9; }
  .comment-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .comment-actions button { padding: 3px 10px; font-size: 12px; }

  .replies { margin-top: 12px; padding-left: 16px; border-left: 2px solid rgba(255,255,255,.2); display: flex; flex-direction: column; gap: 10px; }
  .reply { background: rgba(255,255,255,.08); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .reply .comment-head { margin-bottom: 4px; }
  .reply .comment-text { font-size: 13px; }

  .reply-input { margin-top: 10px; display: none; }
  .reply-input.show { display: block; }
  .reply-input textarea {
    width: 100%; min-height: 50px; resize: vertical;
    border: 1px solid rgba(213,250,241,.3);
    background: rgba(255,255,255,.15);
    border-radius: 10px; padding: 8px;
    font-family: inherit; font-size: 13px; color: #22322A;
  }
  .reply-input .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  .empty-comments { text-align: center; padding: 30px 0; font-size: 14px; opacity: .6; letter-spacing: 1px; }

  .msg-card {
    background: rgba(255,255,255,.12); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
    border-left: 3px solid rgba(197,252,224,.6);
    cursor: pointer; transition: .2s;
  }
  .msg-card:hover { background: rgba(255,255,255,.2); }
  .msg-card.notification { border-left-color: #FFE980; }
  .msg-card.notification.unread { background: rgba(255,233,128,.15); }
  .msg-card.mine { border-left-color: rgba(127,133,211,.7); }
  .msg-card .msg-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; opacity: .7; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
  .msg-card .msg-from { font-weight: 600; font-size: 13px; }
  .msg-card .msg-body { font-size: 14px; white-space: pre-wrap; line-height: 1.8; }
  .msg-card .msg-ref { font-size: 12px; opacity: .7; margin-top: 6px; padding: 4px 10px; background: rgba(255,255,255,.15); border-radius: 8px; display: inline-block; }
  .msg-card .unread-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #C5FCE0; margin-right: 6px; vertical-align: middle; }

function migrateData(old) {
  if (!old) return defaultData();
  const nd = defaultData();
  if (old.home) nd.home = old.home;
  if (old.accounts) nd.accounts = old.accounts;

  // 强制更新首页标题为新版

    nd.spaces[sid].icon = s.icon || nd.spaces[sid].icon;
    nd.spaces[sid].theme = s.theme || nd.spaces[sid].theme || "green";
    nd.spaces[sid].cardColor = (typeof s.cardColor === "number") ? s.cardColor : Math.floor(Math.random()*8);

    nd.spaces[sid].comments = s.comments || [];

function getAccount(user) { return data.accounts[user] || null; }

function getSpaceTheme(spaceId) {
  const sp = data.spaces[spaceId];
  const themeKey = (sp && sp.theme) || "green";
  return SPACE_THEMES[themeKey] || SPACE_THEMES.green;
}
function getSpaceCardColor(spaceId) {
  const sp = data.spaces[spaceId];
  const idx = (sp && typeof sp.cardColor === "number") ? sp.cardColor : 0;
  return COLOR_CARDS[idx] || COLOR_CARDS[0];
}
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function getMode(user, spaceId) {
  if (!user) return null;
  const acc = data.accounts[user];
  if (!acc) return null;
  if (acc.role === "dev") return "x";
  if (acc.owns === spaceId) return "owner";
  return "guest";
}
function canAdd(mode) { return mode === "owner" || mode === "x"; }
function canModifyFile(f) { return currentUser && f.author === currentUser; }
function canManageFolder(folder) { return currentUser && folder.creator === currentUser; }

function getFolderChain(folderId) {
  const spaceData = data.spaces[currentSpace];
  if (!spaceData || !folderId) return [];
  const chain = [];
  let cur = spaceData.folders.find(f => f.id === folderId);
  while (cur) {
    chain.unshift(cur);
    cur = cur.parentId ? spaceData.folders.find(f => f.id === cur.parentId) : null;
  }
  return chain;
}
function isDescendant(folder, maybeAncestorId) {
  const spaceData = data.spaces[currentSpace];
  let cur = folder;
  while (cur && cur.parentId) {
    if (cur.parentId === maybeAncestorId) return true;
    cur = spaceData.folders.find(f => f.id === cur.parentId);
  }
  return false;
}
function getInheritConstraint(parentId) {
  if (!parentId) return null;
  const spaceData = data.spaces[currentSpace];
  const parent = spaceData.folders.find(f => f.id === parentId);
  if (!parent) return null;
  return parent.visibility;
}
function isVisAllowed(vis, parentVis) {
  if (!parentVis) return true;
  return VIS_RANK[vis] >= VIS_RANK[parentVis];
}
function canSeeFolder(folder, user, mode) {
  if (!folder || folder.deleted) return false;

  const creator = folder.creator;
  switch (folder.visibility) {
    case "public":   return true;
    case "ours":     return mode === "owner" || mode === "x";
    case "private":  return user === creator;
    case "password": {
      if (user === creator || mode === "x") return true;
      if (unlockedFolders.has(folder.id)) return true;
      const chain = getFolderChain(folder.id);
      for (const f of chain) {
        if (f.id !== folder.id && unlockedFolders.has(f.id)) return true;
      }
      return false;
    }
    default: return false;
  }
}
function canReplyComment(mode) { return mode === "owner" || mode === "x"; }
function canHideAnyComment(mode) { return mode === "owner" || mode === "x"; }
function canDeleteComment(c) { return currentUser && c.author === currentUser; }

/* ============================================================
   通知
   ============================================================ */
function pushNotification(toUser, notice) {
  const acc = data.accounts[toUser];
  if (!acc) return;
  let targetSpaceId = null;
  if (acc.role === "dev") targetSpaceId = "X";
  else if (acc.owns) targetSpaceId = acc.owns;
  else return;
  if (!data.spaces[targetSpaceId]) return;
  if (!data.spaces[targetSpaceId].notifications) data.spaces[targetSpaceId].notifications = [];
  data.spaces[targetSpaceId].notifications.push({
    id: Date.now() + Math.random(),
    to: toUser,
    ...notice,
    time: Date.now(),
    read: false
  });
}
function getMyNotifications() {
  if (!currentSpace) return [];
  const sp = data.spaces[currentSpace];
  if (!sp || !sp.notifications) return [];
  return sp.notifications.filter(n => n.to === currentUser);
}
function getUnreadNotificationCount() {
  return getMyNotifications().filter(n => !n.read).length;
}
function markAllNotificationsRead() {
  if (!currentSpace) return;
  const sp = data.spaces[currentSpace];
  if (!sp || !sp.notifications) return;
  sp.notifications.forEach(n => { if (n.to === currentUser) n.read = true; });
  save();
  render();
}

/* ============================================================
   撤销
   ============================================================ */
function showUndoToast(msg, undoFn) {
  if (undoTimer) clearTimeout(undoTimer);
  const old = document.querySelector(".undo-toast");
  if (old) old.remove();

  const el = document.createElement("div");
  el.className = "undo-toast";
  el.innerHTML = `<span class="msg">${esc(msg)}</span><button id="undoBtn">回退</button>`;
  document.body.appendChild(el);

  document.getElementById("undoBtn").onclick = () => {
    if (undoTimer) clearTimeout(undoTimer);
    el.remove();
    undoFn();
  };

  undoTimer = setTimeout(() => {
    el.remove();
    undoTimer = null;
  }, 5000);
}

/* ---------- 日历 ---------- */
function renderCalendarModule(mode) {
  const sp = data.spaces[currentSpace];
  const cal = sp.calendar || [];
  const today = new Date();
  const todayStr = fmtDate(today);
  const todayHasRec = cal.some(r => r.date === todayStr);
  const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  let html = `
    <div class="calendar-module ${calExpanded ? 'expanded' : ''}">
      <div class="cal-collapsed" onclick="toggleCalendar()">
        <div class="cal-left">
          ${SVG.calendar} ${calYear}年 ${monthNames[calMonth]}
          ${todayHasRec ? '<span style="font-size:11px;opacity:.7">· 今天有记录</span>' : ''}
        </div>
        <div class="cal-toggle">${calExpanded ? '收起 ▲' : '展开 ▼'}</div>
      </div>
      <div class="cal-body">
        <div class="cal-head">
          <div class="cal-title">${calYear}年 ${monthNames[calMonth]}</div>
          <div class="cal-nav">
            <button onclick="event.stopPropagation();calPrev()">‹</button>
            <button onclick="event.stopPropagation();calToday()">今天</button>
            <button onclick="event.stopPropagation();calNext()">›</button>
          </div>
        </div>
        <div class="cal-grid">
          <div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div>
          <div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div>
          <div class="cal-dow">六</div>
  `;

  const year = calYear, month = calMonth;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const firstDow = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  for (let i = 0; i < firstDow; i++) html += `<div class="cal-day other-month"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isToday = dStr === todayStr;
    const hasRecord = cal.some(r => r.date === dStr);
    html += `<div class="cal-day ${isToday?'today':''}" onclick="openCalDay('${dStr}')">${d}${hasRecord ? '<span class="dot"></span>' : ''}</div>`;
  }
  const totalCells = firstDow + daysInMonth;
  const remain = (7 - totalCells % 7) % 7;
  for (let i = 0; i < remain; i++) html += `<div class="cal-day other-month"></div>`;
  html += `</div></div></div>`;
  return html;
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function toggleCalendar() { calExpanded = !calExpanded; render(); }
function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } render(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } render(); }
function calToday() { const d = new Date(); calYear = d.getFullYear(); calMonth = d.getMonth(); render(); }
function openCalDay(dStr) {
  calSelectedDate = dStr;
  const sp = data.spaces[currentSpace];
  const recs = (sp.calendar || []).filter(r => r.date === dStr).sort((a,b)=>b.time-a.time);
  const mode = getMode(currentUser, currentSpace);
  const editable = canAdd(mode);
  const [y, m, d] = dStr.split("-");
  document.getElementById("calDayTitle").textContent = `${y}年${Number(m)}月${Number(d)}日`;

  let recHtml = "";
  if (!recs.length) {
    recHtml = `<div class="empty" style="padding:16px 0">Waiting for the Echo</div>`;
  } else {
    recs.forEach(r => {
      const acc = data.accounts[r.author];
      const authorName = acc ? displayName(r.author) : "已注销";
      recHtml += `
        <div class="cal-record" style="background:rgba(255,255,255,.5);border-radius:10px;padding:10px 14px;margin-bottom:8px;position:relative;border-left:3px solid #AE973C">
          <div style="font-size:11px;opacity:.6;margin-bottom:4px">${esc(authorName)} · ${formatTime(r.time)}</div>
          <div style="font-size:14px;white-space:pre-wrap;padding-right:40px">${esc(r.text)}</div>
          ${(currentUser === r.author || mode === "x") ? `<button style="position:absolute;top:8px;right:8px;background:transparent;border:none;color:#ccc;font-size:16px;cursor:pointer" onclick="calDelRecord(${r.id})">✕</button>` : ""}
        </div>
      `;
    });
  }
  document.getElementById("calRecords").innerHTML = recHtml;
  document.getElementById("calAddBox").style.display = editable ? "" : "none";
  document.getElementById("calAddBtn").style.display  = editable ? "" : "none";
  openModal("calDayModal");
}
document.getElementById("calAddBtn").onclick = () => {
  const text = document.getElementById("calNewRecord").value.trim();

function calDelRecord(id) {
  if (!confirm("确定删除这条记录？")) return;
  const sp = data.spaces[currentSpace];
  sp.calendar = (sp.calendar || []).filter(r => r.id !== id);

  openCalDay(calSelectedDate);

/* ---------- MESSAGE ---------- */
function renderMessageTab() {
  const unread = getUnreadNotificationCount();
  const showBingo = (messageSubTab === "notice");
  let html = `
    <div class="subtabs">
      <div class="subtab ${messageSubTab==='received'?'active':''}" onclick="switchMessageSub('received')">收到的</div>
      <div class="subtab ${messageSubTab==='sent'?'active':''}"     onclick="switchMessageSub('sent')">我发的</div>
      <div class="subtab ${messageSubTab==='notice'?'active':''}"   onclick="switchMessageSub('notice')">通知</div>

    </div>
  `;
  if (messageSubTab === "received") html += renderReceivedMessages();
  else if (messageSubTab === "sent") html += renderSentMessages();
  else if (messageSubTab === "notice") html += renderNotifications();
  return html;
}
function renderReceivedMessages() {
  const spaceData = data.spaces[currentSpace];
  const mode = getMode(currentUser, currentSpace);
  const allComments = spaceData.comments.filter(c => !c.deleted && !c.replyTo);
  let visible = allComments.filter(c => {
    if (mode === "x") return true;
    if (c.hiddenBy === "self") return false;
    return true;
  });
  if (!visible.length) return `<div class="empty">Waiting for the Echo</div>`;
  let html = '';
  visible.forEach(c => {
    const file = spaceData.files.find(f => f.id === c.fileId);
    const fileName = file ? (file.title || "无标题") : "（已删除文件）";
    const replies = spaceData.comments.filter(r => !r.deleted && r.replyTo === c.id);
    html += `<div class="msg-card" onclick="jumpToComment(${c.fileId}, ${c.id})">
      <div class="msg-head"><span class="msg-from">${esc(getCommentDisplayName(c))}</span><span>${formatTime(c.time)}</span></div>
      <div class="msg-body">${esc(c.text)}</div>
      <div class="msg-ref">📄 ${esc(fileName)} · 回复 ${replies.length} 条</div>
    </div>`;
  });
  return html;
}
function renderSentMessages() {
  let all = [];
  Object.keys(data.spaces).forEach(sid => {
    const sp = data.spaces[sid];
    sp.comments.forEach(c => {
      if (!c.deleted && c.author === currentUser) all.push({ ...c, _spaceId: sid });
    });
  });
  all.sort((a, b) => b.time - a.time);
  if (!all.length) return `<div class="empty">Waiting for the Echo</div>`;
  let html = '';
  all.forEach(c => {
    const sp = data.spaces[c._spaceId];
    const file = sp.files.find(f => f.id === c.fileId);
    const fileName = file ? (file.title || "无标题") : "（已删除文件）";
    html += `<div class="msg-card mine" onclick="jumpToCommentFromOtherSpace('${c._spaceId}', ${c.fileId}, ${c.id})">
      <div class="msg-head"><span class="msg-from">我</span><span>${formatTime(c.time)}</span></div>
      <div class="msg-body">${esc(c.text)}</div>
      <div class="msg-ref">📁 ${esc(sp.name)} · 📄 ${esc(fileName)}</div>
    </div>`;
  });
  return html;
}
function renderNotifications() {
  const notices = getMyNotifications().sort((a, b) => b.time - a.time);
  if (!notices.length) return `<div class="empty">Waiting for the Echo</div>`;
  let html = '';
  notices.forEach(n => {
    const unread = !n.read;
    html += `<div class="msg-card notification ${unread?'unread':''}" onclick="handleNoticeClick('${n.id}')">
      <div class="msg-head"><span class="msg-from">${unread ? '<span class="unread-dot"></span>' : ''}🔔 通知</span><span>${formatTime(n.time)}</span></div>
      <div class="msg-body">${esc(n.text)}</div>
    </div>`;
  });
  return html;
}
function getCommentDisplayName(c) {
  if (c.displayAs === "anonymous") return "隐名";
  if (c.displayAs === "signed")    return c.signedName || "隐名";
  return displayName(c.author);
}
function handleNoticeClick(noticeId) {
  const sp = data.spaces[currentSpace];
  const n = sp.notifications.find(x => String(x.id) === String(noticeId));
  if (!n) return;
  n.read = true;
  save();
  if (n.fileId) currentFileId = n.fileId;
  render();
}
function jumpToComment(fileId, commentId) {
  currentFileId = fileId;
  render();
  setTimeout(() => {
    const el = document.getElementById("comment-" + commentId);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 100);
}
function jumpToCommentFromOtherSpace(spaceId, fileId, commentId) {
  currentSpace = spaceId; currentFolderId = null; currentFileId = fileId;
  render();
  setTimeout(() => {
    const el = document.getElementById("comment-" + commentId);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 100);
}

/* ---------- 设置 ---------- */
function renderSettingsTab() {
  const sp = data.spaces[currentSpace];
  const mode = getMode(currentUser, currentSpace);
  if (mode !== "owner" && mode !== "x") return `<div class="empty">无权访问</div>`;

  const iconOpts = SPACE_ICONS.map(ic =>
    `<div class="icon-opt ${sp.icon===ic?'active':''}" onclick="setSpaceIcon('${ic}')">${ic}</div>`

/* ---------- 桌面内容 ---------- */
function renderDesktopHTML() {
  const mode = getMode(currentUser, currentSpace);
  const spaceData = data.spaces[currentSpace];
  const searching = !!filterKeyword || filterDate !== "all";
  const visibleFolders = spaceData.folders.filter(f => canSeeFolder(f, currentUser, mode));
  let allFiles = spaceData.files.filter(f => !f.deleted);
  if (!searching && canAdd(mode) && activeTab === "mine" && !currentFolderId) {
    allFiles = allFiles.filter(f => f.author === currentUser);
  }
  let items = [];
  if (currentFolderId) {
    const subFolders = visibleFolders.filter(f => f.parentId === currentFolderId);
    let files = allFiles.filter(f => f.folderId === currentFolderId);
    files = filterFiles(files, mode);
    items = subFolders.map(fo => ({ type: "folder", data: fo }))
      .concat(files.map(f => ({ type: "file", data: f, showFolderTag: false })));
  } else {
    if (searching) {
      let files = filterFiles(allFiles, mode);
      items = files.map(f => {
        const folder = f.folderId ? visibleFolders.find(fo => fo.id === f.folderId) : null;
        const path = folder ? getFolderPath(folder) : "";
        return { type: "file", data: f, showFolderTag: !!folder, folderName: path };
      });
      const matchedFolders = visibleFolders.filter(fo => {
        if (!filterKeyword) return false;
        return fo.name.toLowerCase().includes(filterKeyword.toLowerCase());
      });
      items = matchedFolders.map(fo => ({ type: "folder", data: fo })).concat(items);
    } else {
      const rootFolders = visibleFolders.filter(f => !f.parentId);
      const looseFiles = filterFiles(allFiles.filter(f => !f.folderId), mode);
      items = rootFolders.map(fo => ({ type: "folder", data: fo }))
        .concat(looseFiles.map(f => ({ type: "file", data: f, showFolderTag: false })));
    }
  }
  if (!items.length) {
    return `<div class="empty" style="grid-column:1/-1">Waiting for the Echo</div>`;
  }
  return items.map(it => {
    if (it.type === "folder") return renderFolderCard(it.data, mode);
    return renderFileCard(it.data, it.showFolderTag, it.folderName || "");
  }).join("");
}
function getFolderPath(folder) {
  const chain = getFolderChain(folder.id);
  return chain.map(f => f.name).join(" / ");
}
function renderFolderCard(fo, mode) {
  const vis = VIS_LABEL[fo.visibility] || VIS_LABEL.public;
  const spaceData = data.spaces[currentSpace];
  const subCount = spaceData.folders.filter(f => !f.deleted && f.parentId === fo.id).length;
  const fileCount = spaceData.files.filter(f => !f.deleted && f.folderId === fo.id).length;
  const canManage = canManageFolder(fo);
  let countText = [];
  if (subCount > 0) countText.push(`${subCount} 个子文件夹`);
  countText.push(`${fileCount} 个文件`);
  const key = "folder:" + fo.id;
  const selected = selectedIds.has(key);
  const card = getSpaceCardColor(currentSpace);
  const cls = card.type === "warm" ? "warm" : "cool";

  return `
    <div class="folder ${cls} ${selected?'selected':''}" onclick="handleCardClick(event, 'folder', ${fo.id})" oncontextmenu="handleCardRightClick(event, 'folder', ${fo.id})">
      <div class="fname">${SVG.folder} ${esc(fo.name)}</div>
      <div class="fmeta">
        <span class="vis-badge ${vis.cls}">${vis.text}</span>
        · ${countText.join("，")}<br>
        <span style="opacity:.6">由 ${esc(displayName(fo.creator))} 创建</span>
      </div>
      ${canManage && !selectMode ? `<button class="edit-btn" onclick="event.stopPropagation();openFolderEdit(${fo.id})">✏️</button>` : ""}
    </div>
  `;
}
function renderFileCard(f, showFolderTag, folderName) {
  const spaceData = data.spaces[currentSpace];
  const commentCount = spaceData.comments.filter(c => !c.deleted && c.fileId === f.id).length;
  const authorAcc = data.accounts[f.author];
  const authorName = authorAcc ? displayName(f.author) : "已注销";
  const imgs = f.imgs || [];
  const firstImg = imgs[0] || "";
  const imgCount = imgs.length;
  const key = "file:" + f.id;
  const selected = selectedIds.has(key);
  const isLetter = f.type === "letter";
  const typeIcon = isLetter ? "✍️" : "📝";
  const card = getSpaceCardColor(currentSpace);
  const cls = card.type === "warm" ? "warm" : "cool";

  if (isLetter) {
    const bg = f.letterBgColor || "#FEF8DA";
    const previewText = (f.text || "").replace(/---/g, " ").slice(0, 100);
    return `
      <div class="file-card ${cls} ${selected?'selected':''}" onclick="handleCardClick(event, 'file', ${f.id})" oncontextmenu="handleCardRightClick(event, 'file', ${f.id})">
        ${f.author === currentUser ? '<div class="mine-tag">我的</div>' : ""}
        <div class="ftitle">${typeIcon} ${esc(f.title || "无标题")}</div>
        <div class="letter-snippet" style="background:${hexToRgba(bg,0.5)}">${esc(previewText)}${previewText.length >= 100 ? "…" : ""}</div>
        <div class="meta">
          <span>✍️ ${esc(authorName)}</span>
          <span>🕐 ${formatTime(f.updatedAt || f.time)}</span>
          ${commentCount ? `<span>💬 ${commentCount}</span>` : ""}
        </div>
        ${showFolderTag ? `<div><span class="folder-tag">📁 ${esc(folderName)}</span></div>` : ""}
      </div>
    `;
  }
  return `
    <div class="file-card ${cls} ${selected?'selected':''}" onclick="handleCardClick(event, 'file', ${f.id})" oncontextmenu="handleCardRightClick(event, 'file', ${f.id})">
      ${firstImg ? `<img src="${firstImg}">` : ""}
      ${imgCount > 1 ? `<div class="img-count-badge">📷 ${imgCount}</div>` : ""}
      ${f.author === currentUser ? '<div class="mine-tag">我的</div>' : ""}
      <div class="ftitle">${typeIcon} ${esc(f.title || "无标题")}</div>
      ${f.text ? `<div class="text">${esc(f.text)}</div>` : ""}
      <div class="meta">
        <span>✍️ ${esc(authorName)}</span>
        <span>🕐 ${formatTime(f.updatedAt || f.time)}</span>
        ${commentCount ? `<span>💬 ${commentCount}</span>` : ""}
      </div>
      ${showFolderTag ? `<div><span class="folder-tag">📁 ${esc(folderName)}</span></div>` : ""}
    </div>
  `;
}

/* ---------- 卡片点击 ---------- */
function handleCardClick(e, type, id) {
  if (selectMode) { e.preventDefault(); toggleSelect(type, id); return; }
  if (type === "folder") enterFolder(id); else openFile(id);
}
function handleCardRightClick(e, type, id) {
  e.preventDefault();
  if (selectMode) { toggleSelect(type, id); return; }
  enterSelectMode(); toggleSelect(type, id);
}

let longPressTimer = null;
document.addEventListener("touchstart", (e) => {
  const card = e.target.closest(".folder, .file-card");
  if (!card) return;
  if (selectMode) return;
  longPressTimer = setTimeout(() => {
    const onclick = card.getAttribute("onclick") || "";
    const m = onclick.match(/handleCardClick\(event, '(\w+)', (\d+)\)/);
    if (m) { enterSelectMode(); toggleSelect(m[1], Number(m[2])); }
  }, 500);
}, { passive: true });
document.addEventListener("touchend", () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
});
document.addEventListener("touchmove", () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
}, { passive: true });

function enterSelectMode() { selectMode = true; selectedIds.clear(); render(); }
function exitSelectMode()  { selectMode = false; selectedIds.clear(); render(); }
function toggleSelect(type, id) {

  if (selectedIds.has(key)) selectedIds.delete(key); else selectedIds.add(key);
  render();
}

function batchDelete() {
  const ids = [...selectedIds];
  if (!ids.length) return;
  if (!confirm(`确定删除选中的 ${ids.length} 项？`)) return;
  const spaceData = data.spaces[currentSpace];
  const backup = { folders: [], files: [] };
  ids.forEach(key => {
    const [type, idStr] = key.split(":");
    const id = Number(idStr);
    if (type === "folder") {
      const folder = spaceData.folders.find(f => f.id === id);
      if (!folder) return;
      const fids = new Set();
      const collect = (fid) => {
        fids.add(fid);
        spaceData.folders.forEach(f => { if (f.parentId === fid && !f.deleted) collect(f.id); });
      };
      collect(id);
      fids.forEach(fid => {
        const fo = spaceData.folders.find(f => f.id === fid);
        if (fo && !fo.deleted) { backup.folders.push({ ...fo }); fo.deleted = true; }
        spaceData.files.forEach(f => {
          if (f.folderId === fid && !f.deleted) { backup.files.push({ ...f }); f.deleted = true; }
        });
      });
    } else if (type === "file") {
      const f = spaceData.files.find(x => x.id === id);
      if (f && !f.deleted) { backup.files.push({ ...f }); f.deleted = true; }
    }
  });
  save(); exitSelectMode();
  showUndoToast(`已删除 ${ids.length} 项`, () => {
    backup.folders.forEach(bf => {
      const target = spaceData.folders.find(f => f.id === bf.id);
      if (target) Object.assign(target, bf); else spaceData.folders.push(bf);
    });
    backup.files.forEach(bf => {
      const target = spaceData.files.find(f => f.id === bf.id);
      if (target) Object.assign(target, bf); else spaceData.files.push(bf);
    });
    save(); render();
  });
}

  batchMoveIds = ids;
  movingType = "batch";
  movingId = null;
  document.getElementById("moveTitle").textContent = `📦 批量移动 ${ids.length} 项到…`;

}

function splitIntoPages(f) {
  const imgs = f.imgs || [];
  const pages = [];
  if (imgs.length === 0) {
    const txt = (f.text || "").split(/\n---\n/).filter(s => s.trim().length > 0);
    if (txt.length === 0) pages.push({ type: "image", img: "", text: "", isLast: true });
    else txt.forEach((t, i) => pages.push({ type: "image", img: "", text: t.trim(), isLast: i === txt.length - 1 }));
  } else {
    imgs.forEach((src, i) => {
      pages.push({ type: "image", img: src, text: i === 0 ? (f.text || "") : "", isLast: i === imgs.length - 1 });
    });
  }
  return pages;
}

        ${page.text ? `<div class="page-text">${esc(page.text)}</div>` : ""}

  `;
}
function pagePrev() { if (currentPage > 0) { currentPage--; render(); } }

}
let swipeStartX = null;
function attachPageSwipe() {
  const area = document.querySelector(".book-page-wrap");
  if (!area) return;
  area.addEventListener("touchstart", (e) => { swipeStartX = e.touches[0].clientX; }, { passive: true });
  area.addEventListener("touchend", (e) => {
    if (swipeStartX === null) return;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    if (dx > 60) pagePrev();
    else if (dx < -60) pageNext();
    swipeStartX = null;
  }, { passive: true });
}

/* ---------- 留言区 ---------- */
function renderCommentsSection(fileId, mode) {
  const spaceData = data.spaces[currentSpace];
  const allComments = spaceData.comments.filter(c => c.fileId === fileId && !c.deleted);
  const topComments = allComments.filter(c => !c.replyTo).sort((a,b)=>b.time-a.time);
  const visibleTop = topComments.filter(c => canSeeComment(c, mode));
  // 取当前空间主题色
  const theme = getSpaceTheme(currentSpace);
  const themeStyle = `background: ${hexToRgba(theme.bg, 0.25)}; border-color: ${hexToRgba(theme.accent, 0.4)}`;
 let html = `<div class="comments-section" style="${themeStyle}">
  <h3>💬 留言 <span class="count">${visibleTop.length} 条</span></h3>`;
  html += `
    <div class="comment-input-box">
      <textarea id="newCommentText" placeholder="Call me by your NAME" onfocus="scrollToInput(this)"></textarea>
      <div class="comment-input-actions">
        <div class="identity-toggle">
          <label><input type="radio" name="identity" value="real" checked> 留名（${esc(displayName(currentUser))}）</label>
          <label><input type="radio" name="identity" value="anonymous"> 隐名</label>
        </div>
        <button class="primary" onclick="submitComment(${fileId})">发送</button>
      </div>
    </div>
  `;
  if (!visibleTop.length) {
    html += `<div class="empty-comments">Waiting for the Echo</div>`;
  } else {
    html += '<div class="comment-list">';
    visibleTop.forEach(c => {
      const replies = allComments.filter(r => r.replyTo === c.id).sort((a,b)=>a.time-b.time).filter(r => canSeeComment(r, mode));
      const cls = c.hiddenBy === "owner" ? "hidden-by-owner" : c.hiddenBy === "self" ? "hidden-by-self" : "";
      html += `<div class="comment ${cls}" id="comment-${c.id}">`;
      html += renderCommentBody(c, mode, false, fileId);
      if (replies.length) {
        html += '<div class="replies">' + replies.map(r => `<div class="reply" id="comment-${r.id}">${renderCommentBody(r, mode, false, fileId)}</div>`).join("") + '</div>';
      }
      if (canReplyComment(mode)) {
        html += `
          <div class="reply-input" id="reply-input-${c.id}">
            <textarea id="reply-text-${c.id}" placeholder="Echo Back…"></textarea>
            <div class="row">
              <button onclick="cancelReply(${c.id})">取消</button>
              <button class="primary" onclick="submitReply(${c.id}, ${fileId})">Echo Back-回复</button>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    });
    html += '</div>';
  }
  html += `</div>`;
  return html;
}
function renderCommentBody(c, mode, inReceived, fileId) {
  let displayNameStr = getCommentDisplayName(c);
  const acc = data.accounts[c.author];
  const isOwner = acc && acc.role === "owner";
  const isDev = acc && acc.role === "dev";
  let roleTag = "";
  if (isOwner) roleTag = '<span class="badge">主人</span>';
  else if (isDev) roleTag = '<span class="badge">MAKER</span>';
  let hiddenTag = "";
  if (c.hiddenBy === "owner") hiddenTag = '<span class="badge badge-hidden">被主人隐藏</span>';
  if (c.hiddenBy === "self")  hiddenTag = '<span class="badge badge-hidden">自己隐藏</span>';
  let html = `
    <div class="comment-head">
      <span class="who ${isOwner || isDev ? 'op' : ''}">${esc(displayNameStr)}</span>
      ${roleTag}${hiddenTag}
      <span class="time">${formatTime(c.time)}</span>
    </div>
    <div class="comment-text">${esc(c.text)}</div>
  `;
  let actions = [];
  if (!inReceived && canReplyComment(mode) && !c.replyTo) {
    actions.push(`<button class="mini" onclick="showReplyInput(${c.id})">Echo Back</button>`);
  }
  if (!inReceived) {
    const canHideAny = canHideAnyComment(mode);
    const isMine = c.author === currentUser;
    const alreadyHidden = !!c.hiddenBy;
    if (!alreadyHidden) {
      if (canHideAny && !isMine) actions.push(`<button class="mini" onclick="hideComment(${c.id}, 'owner')">隐藏</button>`);
      else if (isMine) actions.push(`<button class="mini" onclick="hideComment(${c.id}, 'self')">隐藏</button>`);
    } else {
      if (canHideAny && c.hiddenBy === "owner") actions.push(`<button class="mini" onclick="unhideComment(${c.id})">取消隐藏</button>`);
      else if (isMine && c.hiddenBy === "self") actions.push(`<button class="mini" onclick="unhideComment(${c.id})">取消隐藏</button>`);
    }
  }
  if (canDeleteComment(c)) actions.push(`<button class="mini" onclick="deleteComment(${c.id})">删除</button>`);
  if (actions.length) html += `<div class="comment-actions">${actions.join("")}</div>`;
  return html;
}
function canSeeComment(c, mode) {
  if (c.deleted) return false;
  if (mode === "x") return true;
  if (!c.hiddenBy) return true;
  if (c.hiddenBy === "owner") {
    if (mode === "owner") return true;
    if (c.author === currentUser) return true;
    return false;
  }
  if (c.hiddenBy === "self") {
    if (c.author === currentUser) return true;
    return false;
  }
  return true;
}

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function formatTime(t) {
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function onFilterKeyword(v) { filterKeyword = v; refreshDesktopOnly(); }
function refreshDesktopOnly() {
  const el = document.getElementById("desktop");
  if (!el) return;
  el.innerHTML = renderDesktopHTML();
}
function onFilterDate(v) { filterDate = v; render(); }
function scrollToInput(el) {
  if (!el) return;
  if (window.innerWidth > 767) return;
  setTimeout(() => { el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 300);
}
function filterFiles(files, mode) {
  return files
    .filter(f => !f.deleted)
    .filter(f => {
      if (filterKeyword) {
        const kw = filterKeyword.toLowerCase();
        const inTitle = (f.title || "").toLowerCase().includes(kw);
        const inText  = (f.text  || "").toLowerCase().includes(kw);
        if (!inTitle && !inText) return false;
      }
      if (filterDate !== "all") {
        const t = f.updatedAt || f.time;
        const now = Date.now();
        if (filterDate === "today") {
          const d = new Date(t), n = new Date();
          if (d.toDateString() !== n.toDateString()) return false;
        } else if (filterDate === "7d") { if (now - t > 7 * 86400000) return false; }
        else if (filterDate === "30d") { if (now - t > 30 * 86400000) return false; }
        else if (filterDate === "custom") {
          if (filterDateFrom && t < new Date(filterDateFrom).getTime()) return false;
          if (filterDateTo   && t > new Date(filterDateTo).getTime() + 86400000) return false;
        }
      }
      return true;
    })
    .sort((a, b) => (b.updatedAt || b.time) - (a.updatedAt || a.time));
}

function submitComment(fileId) {
  const ta = document.getElementById("newCommentText");
  const text = ta.value.trim();
  if (!text) return alert("请输入内容");
  const identity = document.querySelector('input[name="identity"]:checked').value;
  const spaceData = data.spaces[currentSpace];
  const newId = Date.now();
  spaceData.comments.push({
    id: newId, fileId, author: currentUser,
    displayAs: identity, signedName: "", text,
    time: Date.now(), replyTo: null, hiddenBy: null, deleted: false
  });
  const file = spaceData.files.find(f => f.id === fileId);
  const fileName = file ? (file.title || "无标题") : "文件";
  const commenterName = identity === "anonymous" ? "有人" : displayName(currentUser);
  const ownerAcc = Object.keys(data.accounts).find(u => data.accounts[u].owns === currentSpace);
  const notifyTargets = new Set();
  if (ownerAcc && ownerAcc !== currentUser) notifyTargets.add(ownerAcc);
  if (currentUser !== "X" && data.accounts["X"]) notifyTargets.add("X");
  notifyTargets.forEach(target => {
    pushNotification(target, {
      type: "new-comment", from: currentUser,
      commentId: newId, fileId: fileId,
      text: `${commenterName} 在「${fileName}」留下了新留言`,
      spaceId: currentSpace
    });
  });
  save();
  refreshCommentArea(fileId);
}
function refreshCommentArea(fileId) {
  const mode = getMode(currentUser, currentSpace);
  const newHtml = renderCommentsSection(fileId, mode);
  const drawerBody = document.querySelector(".comment-drawer-body");
  if (drawerBody) drawerBody.innerHTML = newHtml;
  const letterComments = document.querySelector(".letter-comments");
  if (letterComments) letterComments.innerHTML = newHtml;
}
function showReplyInput(commentId) {
  document.querySelectorAll(".reply-input.show").forEach(el => el.classList.remove("show"));
  const box = document.getElementById("reply-input-" + commentId);
  if (box) {
    box.classList.add("show");
    const ta = document.getElementById("reply-text-" + commentId);
    if (ta) { ta.focus(); scrollToInput(ta); }
  }
}
function cancelReply(commentId) {
  const box = document.getElementById("reply-input-" + commentId);
  if (box) box.classList.remove("show");
}
function submitReply(parentId, fileId) {
  const ta = document.getElementById("reply-text-" + parentId);
  const text = ta.value.trim();
  if (!text) return alert("请输入内容");
  const spaceData = data.spaces[currentSpace];
  const replyId = Date.now();
  spaceData.comments.push({
    id: replyId, fileId, author: currentUser,
    displayAs: "real", signedName: "", text,
    time: Date.now(), replyTo: parentId, hiddenBy: null, deleted: false
  });
  const parent = spaceData.comments.find(c => c.id === parentId);
  if (parent && parent.author !== currentUser) {
    pushNotification(parent.author, {
      type: "reply", from: currentUser,
      commentId: parentId, fileId,
      text: `${displayName(currentUser)} 回复了你的留言`,
      spaceId: currentSpace
    });
  }
  save();
  refreshCommentArea(fileId);
}
function hideComment(id, by) {
  const spaceData = data.spaces[currentSpace];
  const c = spaceData.comments.find(x => x.id === id);
  if (!c) return;
  c.hiddenBy = by;
  if (by === "owner" && c.author !== currentUser) {
    pushNotification(c.author, {
      type: "comment-hidden", from: currentUser,
      commentId: id, fileId: c.fileId,
      text: `编辑隐藏了你的留言`,
      spaceId: currentSpace
    });
  }
  const fid = c.fileId;
  save();
  refreshCommentArea(fid);
}
function unhideComment(id) {
  const spaceData = data.spaces[currentSpace];
  const c = spaceData.comments.find(x => x.id === id);
  if (!c) return;
  c.hiddenBy = null;
  const fid = c.fileId;
  save();
  refreshCommentArea(fid);
}
function deleteComment(id) {
  const spaceData = data.spaces[currentSpace];
  const c = spaceData.comments.find(x => x.id === id);
  if (!c) return;
  if (!canDeleteComment(c)) return alert("只能删除自己的留言");
  if (!confirm("确定删除这条留言？")) return;
  const fid = c.fileId;
  c.deleted = true;
  save();
  refreshCommentArea(fid);
}

document.getElementById("doUnlock").onclick = () => {
  const pwd = document.getElementById("inUnlockPwd").value;
  const folder = data.spaces[currentSpace].folders.find(f => f.id === pendingFolderId);
  if (!folder) return;
  if (folder.password === pwd) {
    const chain = getFolderChain(folder.id);
    chain.forEach(f => unlockedFolders.add(f.id));
    closeModal("pwdModal");
    currentFolderId = pendingFolderId;
    filterKeyword = "";
    render();
  } else alert("密码错误");
};

/* ============================================================
   新增 / 编辑 文件
   ============================================================ */
function openEdit(id) {
  editingId = id;
  pendingImgs = [];
  pendingType = "image";
  pendingLetter = { bgColor: "#FEF8DA" };
  document.getElementById("inImg").value = "";
  const spaceData = data.spaces[currentSpace];
  const mode = getMode(currentUser, currentSpace);
  const folders = spaceData.folders.filter(f => canSeeFolder(f, currentUser, mode));
  const sel = document.getElementById("inFolder");
  sel.innerHTML = '<option value="">（不放入文件夹）</option>' +
    folders.map(f => `<option value="${f.id}">${esc(getFolderPath(f))}</option>`).join("");

  if (id === null) {
    document.getElementById("editTitle").textContent = "新增文件";
    document.getElementById("inTitle").value = "";
    document.getElementById("inText").value = "";
    document.getElementById("inLetterText").value = "";
    document.getElementById("inLetterDate").value = fmtDateCn(new Date());
    setPendingType("image");
    if (currentFolderId) sel.value = String(currentFolderId);
  } else {
    const f = spaceData.files.find(x => x.id === id);
    if (!canModifyFile(f)) return alert("只有作者本人能编辑");
    document.getElementById("editTitle").textContent = "编辑文件";
    document.getElementById("inTitle").value = f.title || "";
    if (f.type === "letter") {
      setPendingType("letter");
      document.getElementById("inLetterText").value = f.text || "";
      document.getElementById("inLetterDate").value = f.letterDate || "";
      pendingLetter.bgColor = f.letterBgColor || "#FEF8DA";
      updateLetterUI();
    } else {
      setPendingType("image");
      document.getElementById("inText").value = f.text || "";
      pendingImgs = (f.imgs || []).slice();
      renderImgUploader();
    }
    sel.value = f.folderId ? String(f.folderId) : "";
  }
  openModal("editModal");
}
function fmtDateCn(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function setPendingType(t) {
  pendingType = t;
  document.querySelectorAll("#typePicker .type-opt").forEach(el => {
    el.classList.toggle("active", el.dataset.type === t);
  });
  document.getElementById("imageFields").style.display = (t === "image") ? "" : "none";
  document.getElementById("letterFields").style.display = (t === "letter") ? "" : "none";
  if (t === "image") renderImgUploader(); else updateLetterUI();
}
document.querySelectorAll("#typePicker .type-opt").forEach(el => {
  el.onclick = () => {
    if (editingId !== null) return alert("编辑时不能改类型");
    setPendingType(el.dataset.type);
  };
});
function renderImgUploader() {
  const box = document.getElementById("imgUploader");
  let html = "";
  pendingImgs.forEach((src, i) => {
    html += `<div class="img-thumb"><img src="${src}"><button class="remove-btn" onclick="removePendingImg(${i})">✕</button></div>`;
  });
  if (pendingImgs.length < 9) {
    html += `<div class="add-img-btn" onclick="document.getElementById('inImg').click()">＋</div>`;
  }
  box.innerHTML = html;
}
function removePendingImg(i) { pendingImgs.splice(i, 1); renderImgUploader(); }
document.getElementById("inImg").onchange = e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  let remaining = 9 - pendingImgs.length;
  files.slice(0, remaining).forEach(file => {
    const r = new FileReader();
    r.onload = ev => { pendingImgs.push(ev.target.result); renderImgUploader(); };
    r.readAsDataURL(file);
  });
  e.target.value = "";
};
document.querySelectorAll("#bgcolorOptions .bgcolor-dot").forEach(el => {
  el.onclick = () => {
    pendingLetter.bgColor = el.dataset.color;
    document.querySelectorAll("#bgcolorOptions .bgcolor-dot").forEach(d => d.classList.remove("active"));
    el.classList.add("active");
    updateLetterUI();
  };
});
function updateLetterUI() {
  document.querySelectorAll("#bgcolorOptions .bgcolor-dot").forEach(d => {
    d.classList.toggle("active", d.dataset.color === pendingLetter.bgColor);
  });
  updateLetterPreview();
}
function updateLetterPreview() {
  const el = document.getElementById("letterPreview");
  if (!el) return;
  el.style.background = pendingLetter.bgColor;
  const txt = document.getElementById("inLetterText").value || "信件预览会显示在这里";
  el.textContent = txt;
}
document.getElementById("inLetterText").addEventListener("input", updateLetterPreview);

document.getElementById("saveEdit").onclick = () => {
  const title = document.getElementById("inTitle").value.trim();
  const folderVal = document.getElementById("inFolder").value;
  const folderId = folderVal ? Number(folderVal) : null;
  const spaceData = data.spaces[currentSpace];

  if (pendingType === "letter") {
    const text = document.getElementById("inLetterText").value.trim();
    const dateStr = document.getElementById("inLetterDate").value.trim();
    if (!text) return alert("请填写正文");
    if (editingId === null) {
      spaceData.files.push({
        id: Date.now(), type: "letter", title, text, letterDate: dateStr,
        letterBgColor: pendingLetter.bgColor, author: currentUser, folderId,
        time: Date.now(), updatedAt: Date.now(), deleted: false, history: []
      });
    } else {
      const f = spaceData.files.find(x => x.id === editingId);
      if (!canModifyFile(f)) return alert("只有作者本人能编辑");
      f.title = title; f.text = text; f.letterDate = dateStr;
      f.letterBgColor = pendingLetter.bgColor; f.folderId = folderId;
      f.updatedAt = Date.now();
    }
  } else {
    const text = document.getElementById("inText").value.trim();
    if (!title && !text && !pendingImgs.length) return alert("请至少填写一项");
    if (editingId === null) {
      spaceData.files.push({
        id: Date.now(), type: "image", title, imgs: pendingImgs.slice(), text,
        author: currentUser, folderId,
        time: Date.now(), updatedAt: Date.now(), deleted: false, history: []
      });
    } else {
      const f = spaceData.files.find(x => x.id === editingId);
      if (!canModifyFile(f)) return alert("只有作者本人能编辑");
      f.title = title; f.text = text; f.folderId = folderId;
      f.imgs = pendingImgs.slice();
      f.updatedAt = Date.now();
    }
  }
  save(); closeModal("editModal");
  currentFileId = null; currentPage = 0;
  render();
};
function delFile(id) {
  const spaceData = data.spaces[currentSpace];
  const f = spaceData.files.find(x => x.id === id);
  if (!canModifyFile(f)) return alert("只有作者本人能删除");
  if (!confirm("确定删除这个文件？")) return;
  const backup = { ...f };
  f.deleted = true;
  save(); currentFileId = null; currentPage = 0;
  const fileName = f.title || "无标题";
  showUndoToast(`已删除「${fileName}」`, () => {
    const target = spaceData.files.find(x => x.id === backup.id);
    if (target) Object.assign(target, backup);
    save(); render();
  });
  render();
}

/* ============================================================
   移动
   ============================================================ */
let movingType = null;
let movingId = null;
let inlineVis = "public";

function openMove(id) {
  movingType = "file"; movingId = id;
  const spaceData = data.spaces[currentSpace];
  const f = spaceData.files.find(x => x.id === id);
  if (!f || !canModifyFile(f)) return alert("只有作者本人能移动");
  document.getElementById("moveTitle").textContent = "📦 移动文件到…";
  refreshMoveSelect(f.folderId, null);
  resetInlineNewFolder();
  openModal("moveModal");
}
function openMoveFolderFromManage() {
  const folder = data.spaces[currentSpace].folders.find(f => f.id === editingFolderId);
  if (!folder) return;
  movingType = "folder"; movingId = editingFolderId;
  closeModal("folderModal");
  document.getElementById("moveTitle").textContent = "📦 移动文件夹到…";
  refreshMoveSelect(folder.parentId, folder.id);
  resetInlineNewFolder();
  openModal("moveModal");
}
function resetInlineNewFolder() {
  document.getElementById("inlineNewFolder").style.display = "none";
  document.getElementById("inlineFolderName").value = "";
  document.getElementById("inlineFolderPwd").value = "";
  document.getElementById("inlinePwdWrap").style.display = "none";
  inlineVis = "public";
  setInlineVis("public");
}
function refreshMoveSelect(selectedId, excludeFolderId) {
  const spaceData = data.spaces[currentSpace];
  const mode = getMode(currentUser, currentSpace);
  let folders = spaceData.folders.filter(fo => canSeeFolder(fo, currentUser, mode));
  if (excludeFolderId !== null && excludeFolderId !== undefined) {
    folders = folders.filter(fo => fo.id !== excludeFolderId && !isDescendant(fo, excludeFolderId));
  }
  const sel = document.getElementById("moveTarget");
  sel.innerHTML = '<option value="">（不放入文件夹 / 散落）</option>' +
    folders.map(fo => `<option value="${fo.id}">${esc(getFolderPath(fo))}</option>`).join("");
  sel.value = selectedId ? String(selectedId) : "";
}
function toggleInlineNewFolder() {
  const box = document.getElementById("inlineNewFolder");
  box.style.display = (box.style.display === "none") ? "" : "none";
}
function setInlineVis(v) {
  inlineVis = v;
  document.querySelectorAll("#inlineVisOptions .vis-opt").forEach(el => {
    el.classList.toggle("active", el.dataset.vis === v);
  });
  document.getElementById("inlinePwdWrap").style.display = (v === "password") ? "" : "none";
}
document.querySelectorAll("#inlineVisOptions .vis-opt").forEach(el => {
  el.onclick = () => setInlineVis(el.dataset.vis);
});
function createInlineFolder() {
  const name = document.getElementById("inlineFolderName").value.trim();
  if (!name) return alert("请填写文件夹名称");
  const targetVal = document.getElementById("moveTarget").value;
  const parentId = targetVal ? Number(targetVal) : null;
  const parentVis = getInheritConstraint(parentId);
  if (parentVis && !isVisAllowed(inlineVis, parentVis)) return alert(`子文件夹不能比父文件夹更开放`);
  let pwd = "";
  if (inlineVis === "password") {
    pwd = document.getElementById("inlineFolderPwd").value.trim();
    if (!pwd) return alert("密码文件夹需要设置密码");
  }
  const spaceData = data.spaces[currentSpace];
  const newId = Date.now();
  spaceData.folders.push({
    id: newId, name, visibility: inlineVis, password: pwd,
    creator: currentUser, parentId: parentId,
    time: Date.now(), deleted: false, history: []
  });
  save();
  refreshMoveSelect(newId, movingType === "folder" ? movingId : null);
  resetInlineNewFolder();
}
document.getElementById("doMove").onclick = () => {
  const val = document.getElementById("moveTarget").value;
  const targetId = val ? Number(val) : null;
  const spaceData = data.spaces[currentSpace];
  if (movingType === "file") {
    const f = spaceData.files.find(x => x.id === movingId);
    if (!f) return;
    f.folderId = targetId; f.updatedAt = Date.now();
    save(); closeModal("moveModal"); currentFileId = null; render();
  } else if (movingType === "folder") {
    const folder = spaceData.folders.find(f => f.id === movingId);
    if (!folder) return;
    if (targetId === movingId) return alert("不能移到自己里面");
    if (targetId && isDescendant(spaceData.folders.find(f => f.id === targetId), movingId))
      return alert("不能移进自己的子文件夹");
    folder.parentId = targetId;
    save(); closeModal("moveModal"); render();
  } else if (movingType === "batch") {
    batchMoveIds.forEach(key => {
      const [type, idStr] = key.split(":");
      const id = Number(idStr);
      if (type === "file") {
        const f = spaceData.files.find(x => x.id === id);
        if (f) { f.folderId = targetId; f.updatedAt = Date.now(); }
      } else if (type === "folder") {
        const folder = spaceData.folders.find(x => x.id === id);
        if (folder && id !== targetId && !(targetId && isDescendant(spaceData.folders.find(f => f.id === targetId), id))) {
          folder.parentId = targetId;
        }
      }
    });
    save(); closeModal("moveModal");
    batchMoveIds = [];
    exitSelectMode();
  }
};

/* ============================================================
   文件夹 新建 / 编辑 / 删除
   ============================================================ */
function openFolderEdit(id) {
  editingFolderId = id;
  pendingVis = "public";
  document.getElementById("inFolderName").value = "";
  document.getElementById("inFolderPwd").value = "";
  document.getElementById("pwdWrap").style.display = "none";
  setVis("public");
  document.getElementById("folderManageZone").style.display = "none";
  document.getElementById("folderParentInfo").style.display = "none";
  document.querySelectorAll("#visOptions .vis-opt").forEach(el => el.classList.remove("disabled"));
  if (id !== null) {
    const folder = data.spaces[currentSpace].folders.find(f => f.id === id);
    if (!folder || !canManageFolder(folder)) return alert("只有创建者能管理文件夹");
    document.getElementById("folderTitle").textContent = "管理文件夹";
    document.getElementById("inFolderName").value = folder.name;
    setVis(folder.visibility);
    if (folder.visibility === "password") {
      document.getElementById("inFolderPwd").value = folder.password || "";
    }
    document.getElementById("folderManageZone").style.display = "";
    const parentVis = getInheritConstraint(folder.parentId);
    if (parentVis) applyVisConstraint(parentVis);
  } else {
    document.getElementById("folderTitle").textContent = "新建文件夹";
    const parentId = currentFolderId || null;
    const parentVis = getInheritConstraint(parentId);
    if (parentVis) {
      applyVisConstraint(parentVis);
      const parent = data.spaces[currentSpace].folders.find(f => f.id === parentId);
      const info = document.getElementById("folderParentInfo");
      info.style.display = "";
      info.innerHTML = `📁 父文件夹：<b>${esc(parent.name)}</b>（${VIS_LABEL[parentVis].text}）<br>子文件夹不能比它更开放`;
      setVis(parentVis);
    }
  }
  openModal("folderModal");
}
function applyVisConstraint(parentVis) {
  document.querySelectorAll("#visOptions .vis-opt").forEach(el => {
    const v = el.dataset.vis;
    el.classList.toggle("disabled", !isVisAllowed(v, parentVis));
  });
}
function setVis(v) {
  pendingVis = v;
  document.querySelectorAll("#visOptions .vis-opt").forEach(el => {
    el.classList.toggle("active", el.dataset.vis === v);
  });
  document.getElementById("pwdWrap").style.display = (v === "password") ? "" : "none";
}
document.querySelectorAll("#visOptions .vis-opt").forEach(el => {
  el.onclick = () => setVis(el.dataset.vis);
});
document.getElementById("saveFolder").onclick = () => {
  const name = document.getElementById("inFolderName").value.trim();
  if (!name) return alert("请填写文件夹名称");
  let pwd = "";
  if (pendingVis === "password") {
    pwd = document.getElementById("inFolderPwd").value.trim();
    if (!pwd) return alert("密码文件夹需要设置密码");
  }
  const spaceData = data.spaces[currentSpace];
  if (editingFolderId === null) {
    const parentId = currentFolderId || null;
    const parentVis = getInheritConstraint(parentId);
    if (parentVis && !isVisAllowed(pendingVis, parentVis)) return alert(`子文件夹不能比父文件夹更开放`);
    spaceData.folders.push({
      id: Date.now(), name, visibility: pendingVis, password: pwd,
      creator: currentUser, parentId: parentId,
      time: Date.now(), deleted: false, history: []
    });
  } else {
    const folder = spaceData.folders.find(f => f.id === editingFolderId);
    const parentVis = getInheritConstraint(folder.parentId);
    if (parentVis && !isVisAllowed(pendingVis, parentVis)) return alert(`子文件夹不能比父文件夹更开放`);
    folder.name = name; folder.visibility = pendingVis; folder.password = pwd;
  }
  save(); closeModal("folderModal"); render();
};
function askDeleteFolder() {
  const folder = data.spaces[currentSpace].folders.find(f => f.id === editingFolderId);
  if (!folder) return;
  const subCount = data.spaces[currentSpace].folders.filter(f => !f.deleted && f.parentId === folder.id).length;
  const fileCount = data.spaces[currentSpace].files.filter(f => !f.deleted && f.folderId === folder.id).length;
  document.getElementById("delFolderMsg").textContent =
    `文件夹「${folder.name}」里有 ${subCount} 个子文件夹、${fileCount} 个文件。`;
  closeModal("folderModal");
  openModal("delFolderModal");
}
document.getElementById("delWithFiles").onclick = () => {
  const spaceData = data.spaces[currentSpace];
  const folder = spaceData.folders.find(f => f.id === editingFolderId);
  if (!folder) return;
  const toDeleteFolders = new Set();
  const collect = (fid) => {
    toDeleteFolders.add(fid);
    spaceData.folders.forEach(f => { if (f.parentId === fid && !f.deleted) collect(f.id); });
  };
  collect(folder.id);
  const backup = { folders: [], files: [] };
  toDeleteFolders.forEach(fid => {
    const fo = spaceData.folders.find(f => f.id === fid);
    if (fo) { backup.folders.push({ ...fo }); fo.deleted = true; }
    spaceData.files.forEach(f => {
      if (f.folderId === fid && !f.deleted) { backup.files.push({ ...f }); f.deleted = true; }
    });
  });
  save();
  closeModal("delFolderModal");
  if (toDeleteFolders.has(currentFolderId)) currentFolderId = null;
  showUndoToast(`已删除「${folder.name}」`, () => {
    backup.folders.forEach(bf => {
      const target = spaceData.folders.find(f => f.id === bf.id);
      if (target) Object.assign(target, bf); else spaceData.folders.push(bf);
    });
    backup.files.forEach(bf => {
      const target = spaceData.files.find(f => f.id === bf.id);
      if (target) Object.assign(target, bf); else spaceData.files.push(bf);
    });
    save(); render();
  });
  render();
};
document.getElementById("delMoveOut").onclick = () => {
  const spaceData = data.spaces[currentSpace];
  const folder = spaceData.folders.find(f => f.id === editingFolderId);
  if (!folder) return;
  const newParent = folder.parentId || null;
  const movedFolders = [], movedFiles = [];
  spaceData.folders.forEach(f => {
    if (f.parentId === folder.id && !f.deleted) {
      movedFolders.push({ id: f.id, oldParent: f.parentId });
      f.parentId = newParent;
    }
  });
  spaceData.files.forEach(f => {
    if (f.folderId === folder.id && !f.deleted) {
      movedFiles.push({ id: f.id, oldFolder: f.folderId });
      f.folderId = newParent;
    }
  });
  const backup = { ...folder };
  folder.deleted = true;
  save();
  closeModal("delFolderModal");
  if (currentFolderId === folder.id) currentFolderId = folder.parentId || null;
  showUndoToast(`已删除「${folder.name}」`, () => {
    const target = spaceData.folders.find(f => f.id === backup.id);
    if (target) Object.assign(target, backup); else spaceData.folders.push(backup);
    movedFolders.forEach(m => {
      const f = spaceData.folders.find(x => x.id === m.id);
      if (f) f.parentId = m.oldParent;
    });
    movedFiles.forEach(m => {
      const f = spaceData.files.find(x => x.id === m.id);
      if (f) f.folderId = m.oldFolder;
    });
    save(); render();
  });
  render();
};

// 初始化：先拉云端数据，再渲染
(async () => {
  // 显示加载中
  const appEl = document.getElementById("app");
  if (appEl) appEl.innerHTML = '<div style="text-align:center;padding:80px 0;font-size:15px;opacity:.7;letter-spacing:2px">云端加载中…</div>';

  // 拉云端
  const cloudData = await loadFromCloud();

  if (cloudData && cloudData.accounts && cloudData.spaces) {
    // 云端有数据 → 用云端
    data = migrateData(cloudData);
  } else {
    // 云端空 → 检查本地是否有数据
    const localRaw = localStorage.getItem(DATA_KEY);
    if (localRaw) {
      try {
        const localData = JSON.parse(localRaw);
        if (localData && localData.accounts && localData.spaces) {
          // 问用户要不要上传
          if (confirm("检测到本地有数据，是否上传到云端？\n\n（上传后云端会覆盖为空，本地内容会变成云端的初始内容）")) {
            data = migrateData(localData);
            saveToCloud(data);
          } else {
            // 用户不上传 → 用默认数据
            data = defaultData();
            saveToCloud(data);
          }
        } else {
          data = defaultData();
          saveToCloud(data);
        }
      } catch (e) {
        data = defaultData();
        saveToCloud(data);
      }
    } else {
      // 本地也没有 → 用默认数据，传云端
      data = defaultData();
      saveToCloud(data);
    }
  }

  render();
})();
